name: Build role-specific resumes

on:
  push:
    branches:
      - career/project-refresh-2026-10-04
    paths:
      - "latex/**.tex"
      - ".github/workflows/build-resumes.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: career/project-refresh-2026-10-04

      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-fonts-recommended lmodern poppler-utils

      - name: Compile all resume variants
        run: |
          set -euo pipefail
          mkdir -p build
          for source in latex/*.tex; do
            name="$(basename "$source" .tex)"
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build "$source"
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build "$source"
            test "$(pdfinfo "build/$name.pdf" | awk '/^Pages:/ {print $2}')" = "1"
            cp "build/$name.pdf" "$name.pdf"
          done

      - name: Commit generated PDFs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fares_Mohamed_*_Resume.pdf
          if git diff --cached --quiet; then
            echo "Generated PDFs already match."
            exit 0
          fi
          git commit -m "resume: rebuild role-specific PDFs"
          git push origin HEAD:career/project-refresh-2026-10-04
